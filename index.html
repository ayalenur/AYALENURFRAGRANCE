<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #000000;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }
    
    /* Wrapper that holds both image and button together */
    .hero-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      min-height: 100vh;
    }
    
    /* Full-scale image */
    .hero-wrapper img {
      width: 100vw;
      max-width: 1200px;
      height: auto;
      max-height: 95vh;
      object-fit: contain;
      display: block;
    }

    /* Button overlaid directly on top of the image */
    .instagram-btn {
      position: absolute;
      top: 50%;                  /* Center vertically */
      left: 50%;                 /* Center horizontally */
      transform: translate(-50%, -50%); /* Locks perfect center alignment */
      z-index: 10;
      padding: 18px 36px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: #ffffff;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
      border-radius: 30px;
      transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      text-align: center;
      white-space: nowrap;
    }

    .instagram-btn:hover {
      transform: translate(-50%, -50%) scale(1.06);
      opacity: 0.95;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="hero-wrapper">
    <img src="image1.png" alt="Website Display Image">
    
    <a href="https://www.instagram.com/ayalenurfragrance" class="instagram-btn" target="_blank">
      Message me on Instagram
    </a>
  </div>

</body>
</html>
